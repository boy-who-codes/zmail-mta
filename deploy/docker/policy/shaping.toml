["default"]
connection_limit = 10
max_connection_rate = "100/min"
max_deliveries_per_connection = 100
max_message_rate = "100/s"
enable_tls = "Opportunistic"

[provider."yahoo"]
match = [
  { MXSuffix = ".yahoodns.net" }
]
connection_limit = 15
max_connection_rate = "30/s"
max_deliveries_per_connection = 50
max_message_rate = "30/s"
enable_tls = "Opportunistic"

[[provider."yahoo".automation]]
regex = '''\\[TS?S04\\]'''
action = "Suspend"
duration = "30m"

[provider."outlook"]
match = [
  { MXSuffix = ".olc.protection.outlook.com" },
  { MXSuffix = ".mail.protection.outlook.com" }
]
connection_limit = 20
max_connection_rate = "40/s"
max_deliveries_per_connection = 80
max_message_rate = "40/s"
enable_tls = "Opportunistic"

[provider."apple"]
match = [
  { MXSuffix = ".icloud.com" }
]
connection_limit = 10
max_connection_rate = "25/s"
max_deliveries_per_connection = 50
max_message_rate = "25/s"
enable_tls = "Opportunistic"

[provider."google"]
match = [
  { MXSuffix = ".google.com" },
  { MXSuffix = ".googlemail.com" }
]
connection_limit = 20
max_connection_rate = "50/s"
max_deliveries_per_connection = 100
max_message_rate = "50/s"
enable_tls = "Required"
consecutive_connection_failures_before_delay = 5

[[provider."google".automation]]
regex = '''421.*4\.7\.28.*Speed of sending exceeded'''
action = [
  { SetConfig = { name = "max_message_rate", value = "5/s" } },
  { SetConfig = { name = "connection_limit", value = 2 } }
]
duration = "15m"

