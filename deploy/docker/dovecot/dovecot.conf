# MAILOPS Enterprise Dovecot IMAP Server Configuration
# Provides standalone IMAP/IMAPS for Outlook, Apple Mail, and Thunderbird

listen = *
protocols = imap
disable_plaintext_auth = no
auth_mechanisms = plain login

# Storage directory matching KumoMTA maildir delivery
mail_location = maildir:/var/mail/%u/Maildir

# SSL / TLS Configuration
ssl = yes
ssl_cert = </etc/dovecot/tls.crt
ssl_key = </etc/dovecot/tls.key

# User Authentication database
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

log_path = /dev/stdout
info_log_path = /dev/stdout
debug_log_path = /dev/stdout
