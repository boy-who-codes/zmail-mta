services:
  # 1. High-Speed Inbound & Outbound MTA Daemon
  kumomta:
    container_name: mailops-mta
    hostname: mta.mailops.local
    image: ghcr.io/kumocorp/kumomta:latest
    restart: unless-stopped
    command: ["/opt/kumomta/sbin/kumod", "--policy", "/opt/kumomta/etc/policy/init.lua", "--user", "kumod"]
    ports:
      - "${SMTP_PORT:-25}:2525"             # Public SMTP Inbound (Port 25)
      - "${SMTP_ALT_PORT:-2525}:2525"       # Alternate unprivileged SMTP (Port 2525)
      - "${SMTP_SUBMISSION_PORT:-587}:2525" # Secure submission (Port 587)
      - "8000:8000"                         # Internal HTTP Management & Injection API
    volumes:
      - ./policy:/opt/kumomta/etc/policy:ro
      - ./spool:/var/spool/kumomta
      - ./spool/mail:/var/mail
      - ./logs:/var/log/kumomta
    depends_on:
      kumo-tsa:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mailops-net

  # 2. Traffic Shaping Automation Daemon (TSA)
  kumo-tsa:
    container_name: mailops-tsa
    hostname: kumo-tsa
    image: ghcr.io/kumocorp/kumomta:latest
    restart: unless-stopped
    command: ["runuser", "-u", "kumod", "--", "/opt/kumomta/sbin/tsa-daemon", "--policy", "/opt/kumomta/etc/policy/tsa_init.lua"]
    volumes:
      - ./policy:/opt/kumomta/etc/policy:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kumomta/sbin/validate-shaping /opt/kumomta/etc/policy/shaping.toml || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - mailops-net

  # 3. Redis Cache (Rate-Limiting & Cluster State)
  redis:
    container_name: mailops-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mailops-net

  # 4. ZMAIL Control Plane Backend (Go)
  backend:
    container_name: mailops-backend
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../../backend/data:/app/data
      - ./policy:/app/policy
      - ./logs:/var/log/kumomta:ro
    environment:
      - PORT=8080
      - PUBLIC_IP=${PUBLIC_IP:-}
      - SMTP_HOSTNAME=${SMTP_HOSTNAME:-}
      - PRIMARY_DOMAIN=${PRIMARY_DOMAIN:-}
      - KUMO_API=http://kumomta:8000
      - KUMO_SMTP=kumomta:2525
      - REDIS_URL=${REDIS_URL:-redis:6379}
    depends_on:
      - kumomta
    networks:
      - mailops-net

  # 5. ZMAIL Web Desktop OS (Next.js)
  web:
    container_name: mailops-web
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend
    networks:
      - mailops-net

  # 6. Self-Hosted IMAP Server (Dovecot for Outlook / Thunderbird / Apple Mail)
  dovecot:
    container_name: mailops-dovecot
    hostname: imap.mailops.local
    build:
      context: ./dovecot
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${IMAP_PORT:-143}:143"     # IMAP with STARTTLS
      - "${IMAPS_PORT:-993}:993"    # IMAPS (SSL/TLS)
    volumes:
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/users:/etc/dovecot/users:ro
      - ./policy/tls.crt:/etc/dovecot/tls.crt:ro
      - ./policy/tls.key:/etc/dovecot/tls.key:ro
      - ./spool/mail:/var/mail
    networks:
      - mailops-net

volumes:
  redis-data:

networks:
  mailops-net:
    driver: bridge
